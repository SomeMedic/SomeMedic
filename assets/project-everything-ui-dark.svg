<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">03 / EverythingUI</title>
  <desc id="desc">EverythingUI — interface engineering. Decorative diagram, not an application screenshot.</desc>
  <style>:root{--bg:#081612;--panel:#0c2019;--grid:#173a2d;--ink:#edf8f2;--muted:#91afa1;--accent:#42e8a5;--cyan:#83e5db}text{font-variant-ligatures:none}</style>
