<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Maxim / SomeMedic — SIGNAL LAB</title>
  <desc id="desc">Full-stack development and AI. An emerald signal flows into a network of connected nodes. From signal to software.</desc>
  <style>:root{--bg:#081612;--panel:#0c2019;--grid:#173a2d;--ink:#edf8f2;--muted:#91afa1;--accent:#42e8a5;--cyan:#83e5db}text{font-variant-ligatures:none}
      .signal-flow{stroke-dasharray:36 720;animation:flow 7s linear infinite}
      .node-pulse{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .node-pulse:nth-of-type(2n){animation-delay:-2s}
      @keyframes flow{from{stroke-dashoffset:756}to{stroke-dashoffset:0}}
      @keyframes breathe{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
      @media(prefers-reduced-motion:reduce){.signal-flow,.node-pulse{animation:none}.signal-flow{stroke-dasharray:none;opacity:.65}}
    </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width=".65"/></pattern>
    <radialGradient id="aura"><stop stop-color="var(--accent)" stop-opacity=".12"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="480" rx="18" fill="var(--bg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="18" fill="url(#grid)" stroke="var(--grid)"/><ellipse cx="920" cy="230" rx="300" ry="255" fill="url(#aura)"/><path d="M34 59H62" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M48 45L48 73" fill="none" stroke="var(--accent)" stroke-width="2"/><text x="78" y="65" fill="var(--ink)" font-family="'Cascadia Code',Consolas,monospace" font-size="18" font-weight="500" letter-spacing="1.5" >MAXIM / SOMEMEDIC</text><text x="1158" y="64" fill="var(--muted)" font-family="'Cascadia Code',Consolas,monospace" font-size="12" font-weight="400" letter-spacing="1.1" text-anchor="end">PERSONAL ENGINEERING LAB</text><text x="38" y="123" fill="var(--muted)" font-family="'Cascadia Code',Consolas,monospace" font-size="14" font-weight="400" letter-spacing="1.3" >FULL-STACK DEVELOPMENT × AI</text><text x="33" y="236" fill="var(--ink)" font-family="Bahnschrift,'Trebuchet MS',sans-serif" font-size="115" font-weight="700" letter-spacing="-3" >SIGNAL</text><text x="33" y="344" fill="var(--accent)" font-family="Bahnschrift,'Trebuchet MS',sans-serif" font-size="115" font-weight="700" letter-spacing="-3" >LAB</text><g transform="translate(930 244) scale(1.04)"><circle r="55" fill="none" stroke="var(--grid)" stroke-width=".8"/><circle r="112" fill="none" stroke="var(--grid)" stroke-width=".8"/><circle r="170" fill="none" stroke="var(--grid)" stroke-width=".8"/><path d="M-205 0H205" fill="none" stroke="var(--grid)" stroke-dasharray="2 6"/><path d="M0 -184L0 184" fill="none" stroke="var(--grid)" stroke-dasharray="2 6"/><path d="M-150 5L-86 -73" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M-150 5L-84 82" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M-150 5L0 -2" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M-86 -73L-8 -119" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M-86 -73L0 -2" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M-84 82L0 -2" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M-84 82L3 126" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M-8 -119L83 -73" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M0 -2L83 -73" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M0 -2L89 78" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M3 126L89 78" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M83 -73L155 0" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><path d="M89 78L155 0" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="1.3"/><circle class="node-pulse" cx="-150" cy="5" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-0.00s"/><circle cx="-150" cy="5" r="3.2" fill="var(--accent)"/><circle class="node-pulse" cx="-86" cy="-73" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-0.37s"/><circle cx="-86" cy="-73" r="3.2" fill="var(--accent)"/><circle class="node-pulse" cx="-84" cy="82" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-0.74s"/><circle cx="-84" cy="82" r="3.2" fill="var(--accent)"/><circle class="node-pulse" cx="-8" cy="-119" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-1.11s"/><circle cx="-8" cy="-119" r="3.2" fill="var(--accent)"/><circle class="node-pulse" cx="0" cy="-2" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-1.48s"/><circle cx="0" cy="-2" r="5" fill="var(--accent)"/><circle class="node-pulse" cx="3" cy="126" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-1.85s"/><circle cx="3" cy="126" r="3.2" fill="var(--accent)"/><circle class="node-pulse" cx="83" cy="-73" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-2.22s"/><circle cx="83" cy="-73" r="3.2" fill="var(--accent)"/><circle class="node-pulse" cx="89" cy="78" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-2.59s"/><circle cx="89" cy="78" r="3.2" fill="var(--accent)"/><circle class="node-pulse" cx="155" cy="0" r="13" fill="var(--accent)" opacity=".13" style="animation-delay:-2.96s"/><circle cx="155" cy="0" r="3.2" fill="var(--accent)"/><path d="M-245 5H-171L-158 5L-148 -20L-133 31L-116 -39L-100 5H-84L0 -2L83 -73L155 0H215" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" opacity=".25"/><path class="signal-flow" d="M-245 5H-171L-158 5L-148 -20L-133 31L-116 -39L-100 5H-84L0 -2L83 -73L155 0H215" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/></g><text x="1100" y="425" fill="var(--muted)" font-family="'Cascadia Code',Consolas,monospace" font-size="11" font-weight="400" letter-spacing="0.7" text-anchor="end">INPUT → BUILD → ITERATE</text><path d="M38 390H566" fill="none" stroke="var(--grid)" /><text x="38" y="427" fill="var(--muted)" font-family="'Cascadia Code',Consolas,monospace" font-size="18" font-weight="400" letter-spacing="1" >FROM SIGNAL TO SOFTWARE.</text>
